# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: "off"
services:
  - type: web
    name: northfield-portal-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: >-
      python -m app.bootstrap &&
      exec python -m uvicorn app.main:create_app --factory
      --host 0.0.0.0 --port "$PORT" --workers 1
      --no-proxy-headers --no-access-log --no-server-header
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_CROSS_SITE
        value: "true"
      - key: SQLITE_PATH
        value: /tmp/northfield/portal.sqlite3
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_STUDENT_EMAIL
        sync: false
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: SENTINEL_ALLOWED_API_KEY
        value: sentinel-cybershield-demo-secret-key-2026
      - key: SCREEN_LOCK_SIMULATION_ENABLED
        value: "true"
      - key: SCREEN_LOCK_SESSION_TTL
        value: "30"

  - type: web
    name: northfield-portal
    runtime: static
    rootDir: frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: VITE_API_BASE_URL
        sync: false
